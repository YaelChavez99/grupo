<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHEEY BAZAR 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:'Quicksand',sans-serif;padding:24px;
       background:linear-gradient(160deg,#ffe3f1 0%,#ffc9e3 45%,#ffb3d9 100%)}
  .tarjeta{width:100%;max-width:340px;padding:36px 26px 28px;text-align:center;
           background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
           border:2px solid #fff;border-radius:32px;
           box-shadow:0 18px 45px rgba(214,51,132,.22)}
  .icono{display:block;font-size:50px;margin-bottom:10px}
  h1{margin:0 0 10px;font-size:23px;font-weight:700;color:#c2185b}
  p{margin:0 0 22px;font-size:15px;font-weight:500;line-height:1.55;color:#a4547c}
  .btn{display:block;width:100%;padding:17px;font-size:17px;font-weight:700;color:#fff;
       text-decoration:none;border:0;cursor:pointer;font-family:'Quicksand',sans-serif;
       border-radius:50px;background:linear-gradient(135deg,#ff6fae 0%,#f0407f 100%);
       box-shadow:0 10px 22px rgba(240,64,127,.38)}
  .btn:active{transform:scale(.96)}
  .btn2{display:block;width:100%;margin-top:12px;padding:14px;font-size:14px;font-weight:700;
        color:#c2185b;background:#fff0f7;border:2px solid #ffd0e4;border-radius:50px;
        cursor:pointer;font-family:'Quicksand',sans-serif}
  small{display:block;margin-top:18px;font-size:12px;color:#c58aa8;font-weight:500;line-height:1.6}
</style>
</head>
<body>
  <main class="tarjeta">
    <span class="icono">🌸</span>
    <h1>¡Bienvenida a SHEEY BAZAR!</h1>
    <p>Toca el botón para entrar a nuestro grupito ✨</p>
    <a class="btn" id="btn" href="#">Entrar al grupo 💗</a>
    <button class="btn2" id="copiar">Copiar enlace</button>
    <small id="ayuda">Si no abre, toca ⋯ arriba y elige<br>“Abrir en Safari” o “Abrir en Chrome”.</small>
  </main>

<script>
(function(){
  var CODIGO = "Hhe6JSMvN4QBfm2JK7Nf50";
  var web = "https://chat.whatsapp.com/" + CODIGO;

  var ua = navigator.userAgent || "";
  var esIOS = /iPhone|iPad|iPod/i.test(ua);
  var esAndroid = /Android/i.test(ua);
  var enApp = /FBAN|FBAV|FB_IAB|Instagram|Line|MicroMessenger/i.test(ua);

  var destino = web;

  if (enApp && esIOS) {
    // Fuerza la salida a Safari
    destino = "x-safari-" + web;
  } else if (enApp && esAndroid) {
    // Fuerza la salida a Chrome, con respaldo web (nunca a Play Store)
    destino = "intent://chat.whatsapp.com/" + CODIGO +
              "#Intent;scheme=https;package=com.android.chrome;" +
              "S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  }

  var btn = document.getElementById("btn");
  btn.href = destino;

  // Respaldo: si el esquema especial no hace nada, manda a la vía normal
  btn.addEventListener("click", function(){
    setTimeout(function(){
      if (!document.hidden) { window.location.href = web; }
    }, 1200);
  });

  document.getElementById("copiar").onclick = function(){
    var b = this;
    navigator.clipboard.writeText(web).then(function(){
      b.textContent = "¡Copiado! Pégalo en tu navegador";
    }).catch(function(){
      document.getElementById("ayuda").textContent = web;
    });
  };
})();
</script>
</body>
</html>
