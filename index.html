<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHEEY BAZAR</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px;overflow:hidden;font-family:'Jost',sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #fdf3f6 0%, #f9e4ec 45%, #f2d3e0 100%);
  }

  /* pétalos */
  .petalo{
    position:fixed;top:-40px;border-radius:50% 0 50% 0;
    background:#f0c0d2;opacity:.5;pointer-events:none;
    animation:caer linear infinite;
  }
  @keyframes caer{
    0%{transform:translate(0,-40px) rotate(0deg)}
    50%{transform:translate(22px,50vh) rotate(170deg)}
    100%{transform:translate(-12px,106vh) rotate(340deg)}
  }

  .tarjeta{
    position:relative;z-index:2;width:100%;max-width:352px;
    padding:46px 30px 34px;text-align:center;
    background:rgba(255,253,254,.92);backdrop-filter:blur(8px);
    border:1px solid #f0d5e0;border-radius:4px;
    box-shadow:0 24px 60px rgba(150,60,95,.14);
    opacity:0;animation:surgir .9s cubic-bezier(.2,.7,.3,1) .1s forwards;
  }
  @keyframes surgir{to{opacity:1;transform:none}}
  .tarjeta{transform:translateY(20px)}

  .sello{margin-bottom:20px;opacity:0;animation:aparecer .7s ease .35s forwards}

  .marca{
    font-family:'Cormorant Garamond',serif;font-weight:400;
    font-size:31px;letter-spacing:.20em;color:#8e3b5b;
    text-indent:.20em;line-height:1.2;
  }
  .marca span{display:inline-block;opacity:0;transform:translateY(10px)}
  @keyframes letra{to{opacity:1;transform:none}}

  .linea{
    width:0;height:1px;background:#d9a0b8;margin:18px auto 20px;
    animation:trazo .8s ease 1.15s forwards;
  }
  @keyframes trazo{to{width:74px}}

  .sub{
    font-size:14.5px;font-weight:300;line-height:1.75;color:#a06a83;
    letter-spacing:.02em;margin-bottom:30px;
    opacity:0;animation:aparecer .8s ease 1.35s forwards;
  }
  @keyframes aparecer{to{opacity:1;transform:none}}

  .btn{
    position:relative;display:block;width:100%;padding:17px;overflow:hidden;
    font-family:'Jost',sans-serif;font-size:15px;font-weight:400;letter-spacing:.09em;
    color:#fff;text-decoration:none;border:0;cursor:pointer;border-radius:2px;
    background:linear-gradient(135deg,#b8496f 0%,#8e3b5b 100%);
    box-shadow:0 8px 24px rgba(142,59,91,.28);
    opacity:0;animation:aparecer .8s ease 1.55s forwards;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn::after{
    content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);
    animation:brillo 3.4s ease-in-out 2.4s infinite;
  }
  @keyframes brillo{0%{left:-60%}45%,100%{left:130%}}

  .copiar{
    display:block;width:100%;margin-top:11px;padding:13px;
    font-family:'Jost',sans-serif;font-size:12.5px;font-weight:400;letter-spacing:.07em;
    color:#a05073;background:transparent;border:1px solid #ecd2de;border-radius:2px;
    cursor:pointer;opacity:0;animation:aparecer .8s ease 1.7s forwards;
  }

  .ayuda{
    display:block;margin-top:20px;font-size:11.5px;font-weight:300;
    line-height:1.7;color:#c092a6;letter-spacing:.02em;
    opacity:0;animation:aparecer .8s ease 1.9s forwards;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}
    .linea{width:74px}
  }
</style>
</head>
<body>

  <main class="tarjeta">
    <div class="sello">
      <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
        <g fill="#e2a9c0">
          <ellipse cx="21" cy="10" rx="5.4" ry="7.4"/>
          <ellipse cx="21" cy="32" rx="5.4" ry="7.4"/>
          <ellipse cx="10" cy="21" rx="7.4" ry="5.4"/>
          <ellipse cx="32" cy="21" rx="7.4" ry="5.4"/>
        </g>
        <circle cx="21" cy="21" r="4.6" fill="#fdf3f6"/>
        <circle cx="21" cy="21" r="2.4" fill="#d9a0b8"/>
      </svg>
    </div>

    <h1 class="marca" id="marca">SHEEY BAZAR</h1>
    <div class="linea"></div>
    <p class="sub">Novedades y promociones<br>antes que nadie</p>

    <a class="btn" id="btn" href="#">Únete a nuestro grupito</a>
    <button class="copiar" id="copiar">Copiar enlace</button>
    <small class="ayuda" id="ayuda">¿No abre? Toca ⋯ arriba a la derecha<br>y elige “Abrir en Safari” o “Abrir en Chrome”.</small>
  </main>

<script>
(function(){
  var CODIGO = "Hhe6JSMvN4QBfm2JK7Nf50";
  var web = "https://chat.whatsapp.com/" + CODIGO;

  /* pétalos */
  for (var i = 0; i < 9; i++){
    var p = document.createElement("div");
    p.className = "petalo";
    var t = 7 + Math.random() * 7, s = 9 + Math.random() * 8;
    p.style.cssText = "left:" + (Math.random()*100) + "vw;width:" + s + "px;height:" + s +
      "px;animation-duration:" + t + "s;animation-delay:" + (-Math.random()*t) +
      "s;opacity:" + (0.3 + Math.random()*0.35);
    document.body.appendChild(p);
  }

  /* letras del nombre, una por una */
  var m = document.getElementById("marca"), txt = m.textContent;
  m.textContent = "";
  txt.split("").forEach(function(ch, i){
    var sp = document.createElement("span");
    sp.textContent = (ch === " " ? "\u00A0" : ch);
    sp.style.animation = "letra .55s cubic-bezier(.2,.7,.3,1) " + (0.5 + i*0.055) + "s forwards";
    m.appendChild(sp);
  });

  /* salida del navegador de Facebook */
  var ua = navigator.userAgent || "";
  var esIOS = /iPhone|iPad|iPod/i.test(ua), esAndroid = /Android/i.test(ua);
  var enApp = /FBAN|FBAV|FB_IAB|Instagram|Line|MicroMessenger/i.test(ua);
  var destino = web;

  if (enApp && esIOS){
    destino = "x-safari-" + web;
  } else if (enApp && esAndroid){
    destino = "intent://chat.whatsapp.com/" + CODIGO +
              "#Intent;scheme=https;package=com.android.chrome;" +
              "S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  }

  var btn = document.getElementById("btn");
  btn.href = destino;
  btn.addEventListener("click", function(){
    setTimeout(function(){ if (!document.hidden) window.location.href = web; }, 1200);
  });

  document.getElementById("copiar").onclick = function(){
    var b = this;
    navigator.clipboard.writeText(web).then(function(){
      b.textContent = "Enlace copiado";
    }).catch(function(){
      document.getElementById("ayuda").textContent = web;
    });
  };
})();
</script>
</body>
</html>
